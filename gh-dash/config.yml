# gh-dash configuration
# Symlink: ln -sf ~/cs/dotfiles/gh-dash/config.yml ~/.config/gh-dash/config.yml

prSections:
  - title: "By project"
    filters: "org:grupalia repo:grupalia/monorepo repo:grupalia/grupalia-org project:grupalia/4"
  - title: "My PRs"
    filters: "is:open author:@me"
  - title: "Review follow-up"
    filters: >-
      is:open
      -author:@me
      reviewed-by:@me
      updated:>={{ nowModify "-3d" }}
      repo:grupalia/monorepo
      repo:grupalia/grupalia-org
  - title: "Monorepo"
    filters: "is:open repo:grupalia/monorepo"
  - title: "Org"
    filters: "is:open repo:grupalia/grupalia-org"
  - title: "AI Kool-Aid"
    filters: "is:open repo:grupalia/ai-kool-aid"
  - title: "Other repos"
    filters: "is:open repo:rieg-ec/octo.nvim repo:rieg-ec/dotfiles repo:grupalia/landing repo:rieg-ec/lyricl"

issueSections:
  - title: "My Issues"
    filters: "is:open author:@me"
  - title: "Assigned"
    filters: "is:open assignee:@me"

notificationsSections:
  - title: "Review replies"
    filters: >-
      is:unread
      reason:comment
      repo:grupalia/monorepo
      repo:grupalia/grupalia-org
  - title: "Review activity"
    filters: >-
      is:unread
      reason:participating
      repo:grupalia/monorepo
      repo:grupalia/grupalia-org
  - title: "All"
    filters: ""
  - title: "Created"
    filters: "reason:author"
  - title: "Participating"
    filters: "reason:participating"
  - title: "Mentioned"
    filters: "reason:mention"
  - title: "Review Requested"
    filters: "reason:review-requested"
  - title: "Assigned"
    filters: "reason:assign"
  - title: "Subscribed"
    filters: "reason:subscribed"
  - title: "Team Mentioned"
    filters: "reason:team-mention"

repoPaths:
  grupalia/monorepo: ~/cs/grupalia/dev/monorepo
  grupalia/grupalia-org: ~/cs/grupalia/dev/grupalia-org
  grupalia/ai-kool-aid: ~/cs/grupalia/dev/ai-kool-aid
  rieg-ec/octo.nvim: ~/cs/octo.nvim

defaults:
  view: prs
  prsLimit: 20
  issuesLimit: 20
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 0.50
  layout:
    prs:
      repoName:
        grow: true
        width: 15
        hidden: false
      author:
        width: 12
        hidden: false
      base:
        hidden: true

pager:
  diff: delta

keybindings:
  universal:
    - key: "?"
      builtin: help
    - key: J
      builtin: pageDown
    - key: K
      builtin: pageUp
  prs:
    - key: H
      builtin: prevSidebarTab
    - key: L
      builtin: nextSidebarTab
    - key: O
      name: open in octo.nvim
      command: tmux new-window -c {{.RepoPath}} 'nvim -c "Octo pr edit {{.PrNumber}}"'
    - key: C
      builtin: checkout
    - key: D
      name: diffview in nvim
      command: >
        cd {{.RepoPath}} &&
        git fetch origin pull/{{.PrNumber}}/head:pr-{{.PrNumber}} &&
        tmux new-window -c {{.RepoPath}} '
        nvim -c "DiffviewOpen origin/{{.BaseRefName}}...pr-{{.PrNumber}}"
        '
    - key: W
      name: checkout PR (worktree)
      command: >
        cd {{.RepoPath}} &&
        git worktree remove --force /tmp/pr-reviews/{{.PrNumber}} 2>/dev/null;
        rm -rf /tmp/pr-reviews/{{.PrNumber}};
        git worktree prune;
        git fetch origin +pull/{{.PrNumber}}/head:pr-{{.PrNumber}} &&
        git worktree add /tmp/pr-reviews/{{.PrNumber}} pr-{{.PrNumber}} &&
        tmux new-window -c /tmp/pr-reviews/{{.PrNumber}}
    - key: F
      name: full review workspace
      command: >
        ~/cs/dotfiles/bin/pr-review-workspace
        '{{.RepoPath}}'
        '{{.RepoName}}'
        '{{.PrNumber}}'
    - key: "!"
      name: remove me as reviewer
      command: >
        gh api --method DELETE repos/{{.RepoName}}/pulls/{{.PrNumber}}/requested_reviewers
        -f "reviewers[]=rieg-ec"
    - key: v
      builtin: approve
    - key: V
      name: approve (LGTM)
      command: >
        gh pr review --repo {{.RepoName}} --approve --body "LGTM" {{.PrNumber}}

theme:
  ui:
    sectionsShowCount: true
    table:
      compact: false
  colors:
    text:
      primary: "#E2E1ED"
      secondary: "#666CA6"
      inverted: "#242347"
      faint: "#B0B3BF"
      warning: "#E0AF68"
      error: "#DB4B4B"
      success: "#3DF294"
    background:
      selected: "#1B1B33"
    border:
      primary: "#383B5B"
      secondary: "#39386B"
      faint: "#2B2B40"
