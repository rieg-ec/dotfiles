set-option -sg escape-time 10
set-option -sg repeat-time 400
# Enable extended key reporting (needed for Shift+Enter)
set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -g extended-keys always
set -as terminal-features ',xterm*:extkeys'
set -as terminal-features ',screen*:extkeys'
set -s user-keys[0] "\033[13;2u"
set -s user-keys[1] "\033[27;2;13~"
set -s user-keys[2] "\033[13;2~"
bind -n User0 send-keys -l "\033[13;2u"
bind -n User1 send-keys -l "\033[13;2u"
bind -n User2 send-keys -l "\033[13;2u"
# not sure what this does: set-option -sa terminal-overrides ',XXX:RGB'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# set-option -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g allow-passthrough on
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q' # fix cursor error when using vim inside docker

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mouse on

setw -g word-separators ' "='
# setw -ag word-separators "'"

setw -g mode-keys vi

set -g status-interval 1
set -g status-right-length 60
set -g status-right '#[fg=black]#{pane_current_path}'

set -s command-alias[100] 'cc-fork-v=run-shell "~/.tmux/cc-fork.sh -v"'
set -s command-alias[101] 'cc-fork-h=run-shell "~/.tmux/cc-fork.sh -h"'

run '~/.tmux/plugins/tpm/tpm'
